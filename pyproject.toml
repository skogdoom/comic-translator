[project]
name = "comictrans"
# Read from src/comictrans/__init__.py by hatch, below. One version, in the
# place that can report it without the package having been installed.
dynamic = ["version"]
description = "Two-pass comic page translation tool for macOS: extract, translate by hand, apply."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "David Andréasson" }]

dependencies = [
    "pillow>=10.3",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "ruamel.yaml>=0.18",
    "pyphen>=0.15",
    # Apple Vision OCR. Installed automatically on macOS, absent elsewhere;
    # comictrans.ocr.vision is import-guarded so the package still works.
    "pyobjc-framework-Vision>=10.2; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.2; sys_platform == 'darwin'",
]

[project.optional-dependencies]
tesseract = ["pytesseract>=0.3.10"]
# The milestone-4 review GUI. A separate extra, like tesseract: most work on
# this repository never opens a window, and PySide6 is a heavy download.
gui = ["pyside6>=6.7"]

[project.scripts]
comictrans = "comictrans.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# The macOS application bundler, for tools/build_app.py. Its own group and
# emphatically not a runtime dependency: installing comictrans for the
# command line must not pull a bundler nobody is going to run. Not in `dev`
# either, so the everyday `uv sync --group dev` stays small.
bundle = [
    "pyinstaller>=6.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/comictrans/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/comictrans"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "PTH", "ARG", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
# Every FillStrategy takes the same arguments so they stay interchangeable;
# each implementation legitimately ignores the ones it does not need.
"src/comictrans/erase.py" = ["ARG002"]

[tool.mypy]
python_version = "3.12"
files = ["src/comictrans", "tools"]
strict = true
warn_unreachable = true

# Third-party packages without usable type information.
[[tool.mypy.overrides]]
module = ["ruamel.*", "pyphen.*"]
ignore_missing_imports = true

# pyobjc and pytesseract are absent on Linux and stubbed on macOS. Skipping
# their imports keeps them Any on both, so the type check does not depend on
# which machine it runs on.
[[tool.mypy.overrides]]
module = ["pytesseract.*", "Vision.*", "Quartz.*", "Foundation.*", "objc.*"]
ignore_missing_imports = true
follow_imports = "skip"

# PySide6 is different from the two overrides above: it ships real, precise
# stubs, and when the `gui` extra is installed those are used in full, same
# as any other typed dependency. `ignore_missing_imports` only matters when
# it is *not* installed — without this, every file under gui/ would fail to
# type-check at all rather than fall back to Any, on a machine that never
# ran `uv sync --extra gui`.
[[tool.mypy.overrides]]
module = ["PySide6.*"]
ignore_missing_imports = true

# The bundler lives in its own dependency group, so it is absent from the
# environment the type check usually runs in.
[[tool.mypy.overrides]]
module = ["PyInstaller.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# tools/ is not a package and is not installed; this is what lets the tests
# import the bundle build script and check the parts of it that do not need
# a Mac.
pythonpath = ["tools"]
